services:
  database:
    image: ghcr.io/stac-utils/pgstac:v0.9.11  # must match pypgstac version in .venv
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgis
      PGUSER: username
      PGPASSWORD: password
      PGDATABASE: postgis
    ports:
      - "5439:5432"
    command: postgres -N 500
    healthcheck:
      test: pg_isready -U username -d postgis
      interval: 2s
      retries: 30

  app:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
    restart: on-failure  # a fresh database restarts once during init
    environment:
      PGUSER: username
      PGPASSWORD: password
      PGDATABASE: postgis
      PGHOST: database
      PGPORT: 5432
      ENABLE_TRANSACTIONS_EXTENSIONS: "false"
    ports:
      - "8082:8080"
    depends_on:
      database:
        condition: service_healthy
